#baseURL = 'https://cokesme.github.io/fiesta'
theme = 'simple'
title = 'Fiesta'
copyright='cokesme 2026'

[permalinks]
  search = "/search/"

[Params]
  Subtitle = "Minimal Hugo theme."
  mainSections = ["post", "docs"]
  post_meta = ["date", "categories", "taglist"]
  dateformat = "2006-01-02"
  toc = true
  pager = true

[Params.sidebar]
  home = "right"
  list = "right"
  single = "right"
  widgets = ["search", "categories", "taglist", "recent"]

[Params.widgets]
  recent_num = 5
  categories_counter = true
  tags_counter = true
  
[taxonomies]
  tag = "tags"
  category = "categories"

[related]
  includeNewer = true
[[related.indices]]
  name = "tags"
  weight = 80
[[related.indices]]
  name = "categories"
  weight = 60
